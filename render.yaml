services:
  - type: web
    name: confidence-arise-growth
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://confidencearise.com
      - key: FROM_NAME
        value: Confidence Arise
      - key: AUTH_EMAIL
        value: naeemah@confidencearise.org
      - key: AUTH_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v21.0
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: EMAIL_SETTINGS_SECRET
        sync: false
      - key: WHATSAPP_SETTINGS_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CONCIERGE_MODEL
        value: gpt-5.6-luna
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: EMAIL_REPLY_SYNC_ENABLED
        value: "false"
      - key: EMAIL_REPLY_SYNC_MINUTES
        value: "10"
